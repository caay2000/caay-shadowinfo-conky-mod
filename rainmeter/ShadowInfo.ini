;===============================================================================
;                    ShadowInfo - Rainmeter port (from Conky)  v4
;  Ported from the original CAAY ShadowInfo Conky Mod
;  License: GNU GPL v3 or later
;
;  Requisitos: SOLO Rainmeter (el plugin RunCommand va incluido de serie).
;  Fuente: Segoe UI (ya viene con Windows, no hay que instalar nada).
;
;  Notas:
;   - Temp. GPU  -> usa nvidia-smi (necesitas drivers NVIDIA, que ya tienes).
;   - Temp. CPU  -> plugin CoreTemp (incluido en Rainmeter). Necesita el
;                   programa Core Temp abierto en segundo plano: Windows no
;                   expone la temperatura real de la CPU por si solo. Si
;                   Core Temp no esta abierto, la linea simplemente se oculta.
;   - Temp. Caja -> zona termica ACPI de la placa (lo mismo que "Case" /
;                   acpitemp en la version Conky). La da Windows directamente,
;                   sin programas extra. Si la placa no la expone, se oculta.
;   - Top procesos -> via PowerShell en segundo plano, se actualiza cada
;                      10-15s (no cada segundo, para no gastar CPU de mas).
;   - Sin bateria: no aplica en un equipo de sobremesa.
;===============================================================================

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureGPUTemp "Run"][!CommandMeasure MeasureGPUFan "Run"][!CommandMeasure MeasureGPUUsage "Run"][!CommandMeasure MeasureTopCPU "Run"][!CommandMeasure MeasureTopMem "Run"]

[Metadata]
Name=ShadowInfo
Author=Ported for Albert (original: CAAY)
Information=System info skin ported from Conky ShadowInfo
Version=3.0
License=GPL v3

[Variables]
; ---- Edita esto para que coincida con tu adaptador de red ----
NetInterface=Ethernet
; ---- Edita esto para el disco que quieras monitorizar ----
Drive=C:
; ---- Borde derecho (en px) donde se alinea el bloque de fecha ----
DateRightEdge=200

FontName=Segoe UI
White=255,255,255
GrayLight=221,221,221
GrayMed=170,170,170
GrayDark=136,136,136
Orange=255,163,0
Green=119,183,83
Grey6=102,102,102
TimeColor=234,234,234

; ---- Alarma de temperatura de la GPU: a partir de estos grados, todo el
;      bloque GPU (textos y grafica) se pone en #AlarmColor# ----
GPUTempAlarm=85
AlarmColor=255,60,60

; ---- Graficas de CPU y GPU: relleno degradado (de izquierda a derecha) y
;      "sombra" gris reflejada debajo, como en la version Conky ----
; Formato: angulo | color ; posicion (0.0 = izquierda, 1.0 = derecha).
; Si el degradado saliera al reves, cambia 180 por 0.
GraphGradient=180 | #Green# ; 0.0 | 255,225,0 ; 0.5 | #Orange# ; 1.0
GraphAlarmGradient=180 | #AlarmColor# ; 0.0 | #AlarmColor# ; 1.0
GraphShadowColor=#Grey6#
GraphShadowH=14

; ---- Graficas de DISCO y RED: dos histogramas rellenos en espejo. El de
;      arriba (lectura / bajada) con este degradado, el de abajo (escritura /
;      subida) en un color liso ----
GraphUpGradient=180 | 130,45,25 ; 0.0 | 255,95,50 ; 1.0
GraphDownColor=#Green#

; =============================== MEASURES ====================================

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDayName]
Measure=Time
Format=%A

[MeasureDayNum]
Measure=Time
Format=%d

[MeasureMonthName]
Measure=Time
Format=%B

[MeasureYearNum]
Measure=Time
Format=%Y

[MeasureUptime]
Measure=Uptime

; --- Info de sistema (nativo de Rainmeter, sin PowerShell: instantaneo y gratis) ---
[MeasureLocalIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS

; --- Temperatura CPU: plugin CoreTemp (va incluido con Rainmeter). Lee los
;     datos que publica el programa Core Temp, que tiene que estar abierto.
;     MaxTemperature = el nucleo mas caliente. Si Core Temp no esta abierto
;     el valor es 0 -> se oculta el meter en vez de mostrar "0 C". ---
[MeasureCPUTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature
IfCondition=MeasureCPUTemp > 0
IfTrueAction=[!ShowMeter MeterCPUTemp]
IfFalseAction=[!HideMeter MeterCPUTemp]

; --- Temperatura de la caja: zona termica ACPI de la placa, el mismo dato
;     que ${acpitemp} ("Case") en la version Conky. Es un contador de
;     rendimiento de Windows, asi que UsageMonitor lo lee solo (sin PowerShell
;     ni permisos de administrador). Index=1 = la zona mas caliente, por si la
;     placa expone varias. El contador viene en decimas de Kelvin. ---
[MeasureCaseTempRaw]
Measure=Plugin
Plugin=UsageMonitor
Category=Thermal Zone Information
Counter=High Precision Temperature
Index=1

; Decimas de Kelvin -> grados C. Si la placa no expone ninguna zona el valor
; bruto es 0 -> se oculta el meter en vez de mostrar "-273 C".
[MeasureCaseTemp]
Measure=Calc
Formula=(MeasureCaseTempRaw / 10) - 273.15
IfCondition=MeasureCaseTempRaw > 0
IfTrueAction=[!ShowMeter MeterCaseTemp]
IfFalseAction=[!HideMeter MeterCaseTemp]

; --- Trigger: relanza MeasureGPUTemp y MeasureGPUFan cada 5s (RunCommand no
;     se repite solo) ---
[MeasureGPUTempTrigger]
Measure=Calc
Formula=1
UpdateDivider=5
OnUpdateAction=[!CommandMeasure MeasureGPUTemp "Run"][!CommandMeasure MeasureGPUFan "Run"]

; --- Temperatura GPU (nvidia-smi, ya lo tienes instalado) ---
[MeasureGPUTemp]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "[Console]::Write((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits).Trim())"
State=Hide
OutputType=UTF8
UpdateDivider=5
FinishAction=[!UpdateMeter MeterGPUTemp][!Redraw]

; --- Alarma de temperatura de la GPU ---
; Calc que coge el valor de TEXTO de MeasureGPUTemp (mismo truco que
; MeasureGPUUsageGraph: el valor numerico de RunCommand no es el dato).
; Las acciones solo se disparan al CRUZAR el umbral, no en cada update:
; al llegar a #GPUTempAlarm# pinta de rojo todos los meters del grupo GPU,
; y al bajar les devuelve su color original.
[MeasureGPUTempAlarm]
Measure=Calc
Formula=[MeasureGPUTemp]
DynamicVariables=1
IfCondition=MeasureGPUTempAlarm >= #GPUTempAlarm#
IfTrueAction=[!SetOptionGroup GPU FontColor "#AlarmColor#"][!SetOption MeterGPUTemp InlineSetting "Color | #AlarmColor#,255"][!SetOption MeterGPUFan InlineSetting "Color | #AlarmColor#,255"][!SetOption MeterGPUGraphFill Grad "#GraphAlarmGradient#"][!UpdateMeterGroup GPU][!Redraw]
IfFalseAction=[!SetOption MeterGPUHeader FontColor "#Green#"][!SetOption MeterGPUValue FontColor "#Orange#"][!SetOption MeterGPUTemp FontColor "#GrayLight#"][!SetOption MeterGPUFan FontColor "#GrayLight#"][!SetOption MeterGPUTemp InlineSetting "Color | #Orange#,255"][!SetOption MeterGPUFan InlineSetting "Color | #Orange#,255"][!SetOption MeterGPUGraphFill Grad "#GraphGradient#"][!UpdateMeterGroup GPU][!Redraw]

; --- Velocidad del ventilador de la GPU en % (nvidia-smi no da RPM, solo el
;     % sobre el maximo). Lo lanza el mismo trigger que la temperatura. ---
[MeasureGPUFan]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "[Console]::Write((nvidia-smi --query-gpu=fan.speed --format=csv,noheader,nounits).Trim())"
State=Hide
OutputType=UTF8
UpdateDivider=5
FinishAction=[!UpdateMeter MeterGPUFan][!Redraw]

; --- Trigger: relanza MeasureGPUUsage cada 1s. Este es el fix real del bug
;     de la grafica congelada: RunCommand NO se vuelve a ejecutar solo con
;     UpdateDivider, necesita que algo le mande "Run" activamente. ---
[MeasureGPUUsageTrigger]
Measure=Calc
Formula=1
UpdateDivider=1
OnUpdateAction=[!CommandMeasure MeasureGPUUsage "Run"]

; --- Uso de GPU en % (nvidia-smi), para la grafica tipo "CPU" ---
; RunCommand SI actualiza bien el texto (%1), pero su "valor numerico"
; interno no es el porcentaje: es un codigo de estado (-1/0/1/error), asi
; que un meter Line no puede usarlo para graficar directamente.
; El intento anterior (WebParser leyendo un archivo intermedio) fallaba
; por dos motivos a la vez: WebParser ignora el bang !UpdateMeasure (hace
; falta !CommandMeasure "Update"), y aunque se corrija eso, esa lectura es
; ASINCRONA -- el !UpdateMeter siguiente se ejecutaba antes de que
; WebParser hubiera terminado de leer el archivo, mostrando siempre el
; valor viejo (por eso se veia plana).
; La solucion simple y fiable: un measure Calc que coge el VALOR DE TEXTO
; de MeasureGPUUsage con Section Variables ([...] + DynamicVariables=1).
; Esto es sincrono -- no hace falta archivo ni WebParser.
[MeasureGPUUsage]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "[Console]::Write((nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits).Trim())"
State=Hide
OutputType=UTF8
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureGPUUsageGraph][!UpdateMeter MeterGPUValue][!UpdateMeter MeterGPUGraph][!UpdateMeter MeterGPUGraphShadow][!Redraw]

[MeasureGPUUsageGraph]
Measure=Calc
Formula=[MeasureGPUUsage]
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureCPU]
Measure=CPU
Processor=0

; --- Memoria: el valor bruto son bytes usados; el % se calcula en el METER con Percentual=1 ---
[MeasureMemUsed]
Measure=Memory

; --- Trigger: relanza MeasureTopCPU cada 15s ---
[MeasureTopCPUTrigger]
Measure=Calc
Formula=1
UpdateDivider=15
OnUpdateAction=[!CommandMeasure MeasureTopCPU "Run"]

; --- Top 6 procesos por uso de CPU ---
; Un solo PowerShell saca los 6: los 3 primeros, un "|" y los 3 siguientes.
; El nombre se recorta para que cada linea quepa en media columna.
[MeasureTopCPU]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "$l = @(Get-Counter '\Process(*)\% Processor Time' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty CounterSamples | Where-Object {$_.InstanceName -notin 'idle','_total'} | Sort-Object CookedValue -Descending | Select-Object -First 6 | ForEach-Object { $n = $_.InstanceName; if ($n.Length -gt 13) { $n = $n.Substring(0,13) }; '{0,-13} {1,5:N1}%' -f $n,$_.CookedValue }); $nl = [string][char]10; [Console]::Write((($l | Select-Object -First 3) -join $nl) + '|' + (($l | Select-Object -Skip 3) -join $nl))"
State=Hide
OutputType=UTF8
UpdateDivider=15
FinishAction=[!UpdateMeasure MeasureTopCPULeft][!UpdateMeasure MeasureTopCPURight][!UpdateMeter MeterTopCPUList][!UpdateMeter MeterTopCPUList2][!Redraw]

; Parten la salida de MeasureTopCPU por el "|": lo de antes (puestos 1-3)
; va a la columna izquierda y lo de despues (4-6) a la derecha.
[MeasureTopCPULeft]
Measure=String
String=[MeasureTopCPU]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)\|.*$":""

[MeasureTopCPURight]
Measure=String
String=[MeasureTopCPU]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^.*\|":""

; --- Trigger: relanza MeasureTopMem cada 10s ---
[MeasureTopMemTrigger]
Measure=Calc
Formula=1
UpdateDivider=10
OnUpdateAction=[!CommandMeasure MeasureTopMem "Run"]

; --- Top 6 procesos por uso de RAM ---
; Un solo PowerShell saca los 6: los 3 primeros, un "|" y los 3 siguientes.
; El nombre se recorta para que cada linea quepa en media columna.
[MeasureTopMem]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "$l = @(Get-Process | Sort-Object WorkingSet -Descending | Select-Object -First 6 | ForEach-Object { $n = $_.ProcessName; if ($n.Length -gt 12) { $n = $n.Substring(0,12) }; '{0,-12} {1,6:N0} MB' -f $n,($_.WorkingSet/1MB) }); $nl = [string][char]10; [Console]::Write((($l | Select-Object -First 3) -join $nl) + '|' + (($l | Select-Object -Skip 3) -join $nl))"
State=Hide
OutputType=UTF8
UpdateDivider=10
FinishAction=[!UpdateMeasure MeasureTopMemLeft][!UpdateMeasure MeasureTopMemRight][!UpdateMeter MeterTopMemList][!UpdateMeter MeterTopMemList2][!Redraw]

; Parten la salida de MeasureTopMem por el "|": lo de antes (puestos 1-3)
; va a la columna izquierda y lo de despues (4-6) a la derecha.
[MeasureTopMemLeft]
Measure=String
String=[MeasureTopMem]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)\|.*$":""

[MeasureTopMemRight]
Measure=String
String=[MeasureTopMem]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?s)^.*\|":""

; --- Disco: valores brutos en bytes; % y formato legible se aplican en los METERS ---
[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=#Drive#

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=#Drive#
Total=1

[MeasureDiskUsed]
Measure=FreeDiskSpace
Drive=#Drive#
InvertMeasure=1

; --- Actividad de disco en tiempo real (lectura/escritura), NUEVO en v2 ---
; UsageMonitor es el plugin moderno para contadores de rendimiento de
; Windows (sustituye al antiguo PerfMon, que esta obsoleto). A diferencia
; de RunCommand, no hace falta lanzarlo con "Run": se actualiza solo, como
; CPU o Memory.
[MeasureDiskRead]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=#Drive#

[MeasureDiskWrite]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=#Drive#

; BUG FIX: UsageMonitor devuelve DOS valores por separado -- un numero (la
; velocidad real) y un string (el nombre de la instancia, aqui "C:"). Un
; meter String con MeasureName usa el STRING, por eso salia "Lectura: C:/s"
; literalmente -- %1 nunca fue la velocidad, era el nombre "C:". La forma
; documentada de arreglarlo es un measure Calc que coge el valor NUMERICO
; de la medida (sin corchetes = numero, no string) y usarlo en el meter.
[MeasureDiskReadScaled]
Measure=Calc
Formula=MeasureDiskRead

[MeasureDiskWriteScaled]
Measure=Calc
Formula=MeasureDiskWrite

[MeasureNetIn]
Measure=NetIn
Interface=#NetInterface#

[MeasureNetOut]
Measure=NetOut
Interface=#NetInterface#

[MeasureNetInTotal]
Measure=NetIn
Interface=#NetInterface#
Cumulative=1

[MeasureNetOutTotal]
Measure=NetOut
Interface=#NetInterface#
Cumulative=1

; ================================ METERS ======================================

; --- Reloj (fijo arriba) + fecha apilada y alineada a la derecha ---
; El reloj ya no depende de nada -> Y fija, simple.
[MeterTime]
Meter=String
MeasureName=MeasureTime
X=430
Y=0
W=430
StringAlign=Right
FontFace=#FontName#
FontSize=90
FontColor=#TimeColor#
AntiAlias=1

; La fecha se construye de abajo hacia arriba: "2026" se ancla a la base
; del reloj, "30 July" va encima (combinados en un solo meter para poder
; alinear a la derecha sin depender de anchos propios), y "Thursday"
; encima de esa. Las 3 lineas usan una caja fija (X/W) que termina en
; #DateRightEdge#, con StringAlign=Right -- asi Rainmeter hace el ajuste
; el solo y no dependemos de que un meter "sepa" su propio ancho/alto
; (eso fue justo el bug de la version anterior: un meter referenciandose
; a si mismo con [MeterX:H] no funciona, se resuelve como 0).
[MeterYear]
Meter=String
MeasureName=MeasureYearNum
X=(#DateRightEdge#-80)
W=180
StringAlign=Right
Y=([MeterTime:Y]+[MeterTime:H]-60)
DynamicVariables=1
FontFace=#FontName#
FontSize=16
FontColor=#GrayLight#
AntiAlias=1

[MeterDayNumMonth]
Meter=String
MeasureName=MeasureDayNum
MeasureName2=MeasureMonthName
Text="%1 %2"
X=(#DateRightEdge#-80)
W=180
StringAlign=Right
Y=([MeterYear:Y]-27)
DynamicVariables=1
FontFace=#FontName#
FontSize=16
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterDayName]
Meter=String
MeasureName=MeasureDayName
X=(#DateRightEdge#-80)
W=180
StringAlign=Right
Y=([MeterDayNumMonth:Y]-27)
DynamicVariables=1
FontFace=#FontName#
FontSize=16
FontColor=#GrayLight#
AntiAlias=1

; --- SYSTEM ---
; Se referencia directamente la base del reloj (el elemento mas alto de
; los dos) en vez de depender del orden de meters anteriores.
[MeterSystemHeader]
Meter=String
Text=SYSTEM
X=20
Y=([MeterTime:Y]+[MeterTime:H])
DynamicVariables=1
FontFace=#FontName#
FontSize=20
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterSystemLine]
Meter=Shape
Shape=Rectangle 0,0,410,2 | Fill Color 255,163,0 | StrokeWidth 0
X=20
Y=3R

[MeterUptimeValue]
Meter=String
MeasureName=MeasureUptime
X=20
Y=10R
FontFace=#FontName#
FontSize=13
StringStyle=Bold
FontColor=#Orange#
AntiAlias=1

[MeterIPValue]
Meter=String
MeasureName=MeasureLocalIP
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
StringStyle=Bold
FontColor=#Orange#
AntiAlias=1

; --- CPU ---
[MeterCPUHeader]
Meter=String
Text=CPU
X=20
Y=20R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

; Porcentaje de uso al lado de la cabecera (igual que en la GPU).
[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
NumOfDecimals=0
Text="%1%"
X=15R
Y=0r
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

; Alineada a la derecha, igual que la de la GPU. Oculta mientras Core Temp
; no este abierto (ver MeasureCPUTemp).
[MeterCPUTemp]
Meter=String
MeasureName=MeasureCPUTemp
NumOfDecimals=0
Text="Temperatura: %1 C"
X=430
Y=0r
StringAlign=Right
Hidden=1
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Temperatura: (.*)
InlinePattern2=Temperatura: (.*)

; Temperatura de la caja, tambien a la derecha. Si la de CPU esta visible
; (Core Temp abierto) va debajo de ella; si no, ocupa su sitio en la linea
; de la cabecera.
[MeterCaseTemp]
Meter=String
MeasureName=MeasureCaseTemp
NumOfDecimals=0
Text="Caja: %1 C"
X=430
Y=([MeterCPUValue:Y]+(([MeasureCPUTemp:] > 0) ? [MeterCPUTemp:H] : 0))
DynamicVariables=1
StringAlign=Right
Hidden=1
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Caja: (.*)
InlinePattern2=Caja: (.*)

; La grafica va debajo de lo mas alto de los dos: la cabecera, o las dos
; lineas de temperatura cuando se ven ambas.
; Grafica rellena con degradado + sombra, como en Conky. Son 3 meters:
;  - MeterCPUGraph: el histograma. Hace de CONTENEDOR (mascara): no se
;    dibuja el mismo, solo define la silueta.
;  - MeterCPUGraphFill: rectangulo con el degradado, metido en ese
;    contenedor (Container=...), asi solo se ve donde hay histograma. Su
;    X/Y son relativos al contenedor, por eso 0,0.
;  - MeterCPUGraphShadow: el mismo histograma, gris, bajito y con Flip=1
;    (crece hacia abajo) -> la "sombra" reflejada.
[MeterCPUGraph]
Meter=Histogram
MeasureName=MeasureCPU
X=20
Y=([MeterCPUValue:Y]+max([MeterCPUValue:H],([MeterCaseTemp:Y]-[MeterCPUValue:Y]+[MeterCaseTemp:H]))+10)
DynamicVariables=1
W=410
H=70
PrimaryColor=255,255,255,255

[MeterCPUGraphFill]
Meter=Shape
Container=MeterCPUGraph
X=0
Y=0
Shape=Rectangle 0,0,410,70 | StrokeWidth 0 | Fill LinearGradient Grad
Grad=#GraphGradient#

[MeterCPUGraphShadow]
Meter=Histogram
MeasureName=MeasureCPU
X=20
Y=([MeterCPUGraph:Y]+[MeterCPUGraph:H]+2)
DynamicVariables=1
W=410
H=#GraphShadowH#
PrimaryColor=#GraphShadowColor#
Flip=1

; Dos columnas: puestos 1-3 a la izquierda y 4-6 a la derecha, estos en
; un gris mas apagado para que se vea que pesan menos.
[MeterTopCPUList]
Meter=String
MeasureName=MeasureTopCPULeft
X=20
Y=15R
W=195
H=60
FontFace=Consolas
FontSize=12
FontColor=#GrayLight#
AntiAlias=1

[MeterTopCPUList2]
Meter=String
MeasureName=MeasureTopCPURight
X=235
Y=0r
W=195
H=60
FontFace=Consolas
FontSize=12
FontColor=#GrayMed#
AntiAlias=1

; --- GPU ---
[MeterGPUHeader]
Meter=String
Group=GPU
Text=GPU
X=20
Y=15R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

; Porcentaje de uso al lado de la cabecera.
[MeterGPUValue]
Meter=String
Group=GPU
MeasureName=MeasureGPUUsage
Text="%1%"
DynamicVariables=1
X=15R
Y=0r
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

; Temperatura y ventilador apilados y alineados a la derecha (X=430 es el
; borde derecho del skin, como el resto de valores de la columna derecha).
[MeterGPUTemp]
Meter=String
Group=GPU
MeasureName=MeasureGPUTemp
Text="Temperatura: %1 C"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Temperatura: (.*)
InlinePattern2=Temperatura: (.*)

[MeterGPUFan]
Meter=String
Group=GPU
MeasureName=MeasureGPUFan
Text="Ventilador: %1 %"
DynamicVariables=1
X=430
Y=0R
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Ventilador: (.*)
InlinePattern2=Ventilador: (.*)

; Misma grafica con degradado + sombra que la CPU (ver comentario alli).
; La alarma de temperatura cambia el degradado del relleno (opcion Grad).
[MeterGPUGraph]
Meter=Histogram
Group=GPU
MeasureName=MeasureGPUUsageGraph
X=20
Y=10R
W=410
H=70
PrimaryColor=255,255,255,255

[MeterGPUGraphFill]
Meter=Shape
Group=GPU
Container=MeterGPUGraph
X=0
Y=0
Shape=Rectangle 0,0,410,70 | StrokeWidth 0 | Fill LinearGradient Grad
Grad=#GraphGradient#

[MeterGPUGraphShadow]
Meter=Histogram
MeasureName=MeasureGPUUsageGraph
X=20
Y=([MeterGPUGraph:Y]+[MeterGPUGraph:H]+2)
DynamicVariables=1
W=410
H=#GraphShadowH#
PrimaryColor=#GraphShadowColor#
Flip=1

; --- MEMORY ---
[MeterMemHeader]
Meter=String
Text=MEMORY
X=20
Y=25R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

; Percentual=1 va en el METER (no en la medida): convierte el valor bruto
; (bytes usados) a % usando el rango 0-total que la medida Memory ya conoce.
[MeterMemValue]
Meter=String
MeasureName=MeasureMemUsed
Percentual=1
NumOfDecimals=0
Text="%1%"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterMemBar]
Meter=Bar
MeasureName=MeasureMemUsed
X=20
Y=12R
W=410
H=14
BarColor=119,183,83
SolidColor=40,40,40,180
BarOrientation=Horizontal

; Dos columnas: puestos 1-3 a la izquierda y 4-6 a la derecha, estos en
; un gris mas apagado para que se vea que pesan menos.
[MeterTopMemList]
Meter=String
MeasureName=MeasureTopMemLeft
X=20
Y=15R
W=195
H=60
FontFace=Consolas
FontSize=12
FontColor=#GrayLight#
AntiAlias=1

[MeterTopMemList2]
Meter=String
MeasureName=MeasureTopMemRight
X=235
Y=0r
W=195
H=60
FontFace=Consolas
FontSize=12
FontColor=#GrayMed#
AntiAlias=1

; --- DISKS ---
[MeterDiskHeader]
Meter=String
Text=#Drive# DISK
X=20
Y=18R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

[MeterDiskUsedValue]
Meter=String
MeasureName=MeasureDiskUsed
Percentual=1
NumOfDecimals=0
Text="%1% usado"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDiskUsed
X=20
Y=12R
W=410
H=14
BarColor=255,163,0
SolidColor=40,40,40,180
BarOrientation=Horizontal

[MeterDiskFreeValue]
Meter=String
MeasureName=MeasureDiskFree
AutoScale=1
NumOfDecimals=1
Text="Libre: %1B"
DynamicVariables=1
X=20
Y=8R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Libre: (.*)
InlinePattern2=Libre: (.*)

[MeterDiskTotalValue]
Meter=String
MeasureName=MeasureDiskTotal
AutoScale=1
NumOfDecimals=1
Text="Total: %1B"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Total: (.*)
InlinePattern2=Total: (.*)

; --- Actividad de disco: velocidad de lectura / escritura y sus graficas ---

; MeasureName apunta a las medidas *Scaled* (el Calc que arregla el bug
; de "C:/s" -- ver comentario junto a MeasureDiskReadScaled mas arriba).
[MeterDiskReadValue]
Meter=String
MeasureName=MeasureDiskReadScaled
AutoScale=1
NumOfDecimals=1
Text="Lectura: %1B/s"
DynamicVariables=1
X=20
Y=5R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Lectura: (.*)
InlinePattern2=Lectura: (.*)

[MeterDiskWriteValue]
Meter=String
MeasureName=MeasureDiskWriteScaled
AutoScale=1
NumOfDecimals=1
Text="Escritura: %1B/s"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Escritura: (.*)
InlinePattern2=Escritura: (.*)

; Dos histogramas rellenos en espejo, con una linea central comun:
;  - Lectura arriba: crece hacia arriba, relleno con #GraphUpGradient#
;    (misma tecnica de contenedor que la grafica de CPU, ver alli).
;  - Escritura abajo: Flip=1 -> crece hacia abajo, en #GraphDownColor#.
; Usan las medidas SIN escalar: un histograma coge el valor numerico
; directamente (ver nota del bug de "C:/s" mas arriba).
[MeterDiskReadGraph]
Meter=Histogram
MeasureName=MeasureDiskRead
X=20
Y=5R
W=410
H=45
PrimaryColor=255,255,255,255
AutoScale=1

[MeterDiskReadGraphFill]
Meter=Shape
Container=MeterDiskReadGraph
X=0
Y=0
Shape=Rectangle 0,0,410,45 | StrokeWidth 0 | Fill LinearGradient Grad
Grad=#GraphUpGradient#

[MeterDiskWriteGraph]
Meter=Histogram
MeasureName=MeasureDiskWrite
X=20
Y=([MeterDiskReadGraph:Y]+[MeterDiskReadGraph:H]+2)
DynamicVariables=1
W=410
H=45
PrimaryColor=#GraphDownColor#
AutoScale=1
Flip=1

; --- NETWORK ---
[MeterNetHeader]
Meter=String
Text=RED (#NetInterface#)
X=20
Y=18R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

[MeterNetDownValue]
Meter=String
MeasureName=MeasureNetIn
AutoScale=1
NumOfDecimals=1
Text="Bajada: %1B/s"
DynamicVariables=1
X=20
Y=10R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Bajada: (.*)
InlinePattern2=Bajada: (.*)

[MeterNetUpValue]
Meter=String
MeasureName=MeasureNetOut
AutoScale=1
NumOfDecimals=1
Text="Subida: %1B/s"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Subida: (.*)
InlinePattern2=Subida: (.*)

; Totales: label en gris + valor en naranja negrita, todo en UN meter via
; Inline Options -- el patron "Total: (.*)" captura solo el numero y le
; aplica el color, sin necesitar 2 meters encadenados (y sin depender de
; saber el ancho del texto para alinear a la derecha).
[MeterNetDownTotal]
Meter=String
MeasureName=MeasureNetInTotal
AutoScale=1
NumOfDecimals=1
Text="Total: %1B"
DynamicVariables=1
X=20
Y=8R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Total: (.*)
InlinePattern2=Total: (.*)

[MeterNetUpTotal]
Meter=String
MeasureName=MeasureNetOutTotal
AutoScale=1
NumOfDecimals=1
Text="Total: %1B"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Total: (.*)
InlinePattern2=Total: (.*)

; Igual que las de disco: bajada arriba con degradado, subida abajo en
; espejo (Flip=1) con el color liso.
[MeterNetDownGraph]
Meter=Histogram
MeasureName=MeasureNetIn
X=20
Y=5R
W=410
H=45
PrimaryColor=255,255,255,255
AutoScale=1

[MeterNetDownGraphFill]
Meter=Shape
Container=MeterNetDownGraph
X=0
Y=0
Shape=Rectangle 0,0,410,45 | StrokeWidth 0 | Fill LinearGradient Grad
Grad=#GraphUpGradient#

[MeterNetUpGraph]
Meter=Histogram
MeasureName=MeasureNetOut
X=20
Y=([MeterNetDownGraph:Y]+[MeterNetDownGraph:H]+2)
DynamicVariables=1
W=410
H=45
PrimaryColor=#GraphDownColor#
AutoScale=1
Flip=1
