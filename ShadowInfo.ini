; --- NUEVO en v2: grafica de actividad de disco (lectura=verde, escritura=rojo) ---
; Igual que las graficas de RED de mas abajo: dos Line superpuestas con
; AutoScale=1, cada una con su propia medida en bytes/seg.

; MeasureName apunta a las medidas *Scaled* (el Calc que arregla el bug
; de "C:/s" -- ver comentario junto a MeasureDiskReadScaled mas arriba).
[MeterDiskReadValue]
Meter=String
MeasureName=MeasureDiskReadScaled
AutoScale=1
NumOfDecimals=1
Text="Lectura: %1/s"
DynamicVariables=1
X=20
Y=5R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Lectura: (.*)
InlinePattern2=Lectura: (.*)

[MeterDiskWriteValue]
Meter=String
MeasureName=MeasureDiskWriteScaled
AutoScale=1
NumOfDecimals=1
Text="Escritura: %1/s"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1
InlineSetting=Color | #Orange#,255
InlineSetting2=Weight | 700
InlinePattern=Escritura: (.*)
InlinePattern2=Escritura: (.*)

; Lectura: orientacion normal -> el 0 esta ABAJO de su propia caja y los
; picos suben hacia arriba (hacia fuera, alejandose del centro). Los
; graficos Line siguen usando las medidas SIN escalar -- eso es correcto,
; Line ya usa el valor numerico directamente (ver nota del bug mas arriba).
[MeterDiskReadGraph]
Meter=Line
MeasureName=MeasureDiskRead
X=20
Y=5R
W=410
H=45
LineColor=119,183,83
LineWidth=2
AntiAlias=1
AutoScale=1

; Escritura: Flip=1 invierte la grafica -> el 0 pasa a estar ARRIBA de su
; caja y los picos bajan hacia abajo. Resultado: las dos comparten una
; linea central y crecen en espejo, como en la imagen original.
[MeterDiskWriteGraph]
Meter=Line
MeasureName=MeasureDiskWrite
X=20
Y=10R
W=410
H=45
LineColor=#Red#
LineWidth=2
AntiAlias=1
AutoScale=1
Flip=1

