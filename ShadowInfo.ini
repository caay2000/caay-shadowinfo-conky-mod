;===============================================================================
;                    ShadowInfo - Rainmeter port (from Conky)  v4
;  Ported from the original CAAY ShadowInfo Conky Mod
;  License: GNU GPL v3 or later
;
;  Requisitos: SOLO Rainmeter (el plugin RunCommand va incluido de serie).
;  Fuente: Segoe UI (ya viene con Windows, no hay que instalar nada).
;
;  Notas:
;   - Temp. GPU  -> usa nvidia-smi (necesitas drivers NVIDIA, que ya tienes).
;   - Temp. CPU  -> intento via WMI. En muchos PCs de sobremesa Windows NO
;                   expone esta sonda sin software del fabricante; si ves
;                   "N/D" es justo por eso, no es un fallo del skin.
;   - Top procesos -> via PowerShell en segundo plano, se actualiza cada
;                      10-15s (no cada segundo, para no gastar CPU de mas).
;   - Sin bateria: no aplica en un equipo de sobremesa.
;===============================================================================

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureGPUTemp "Run"][!CommandMeasure MeasureGPUUsage "Run"][!CommandMeasure MeasureTopCPU "Run"][!CommandMeasure MeasureTopMem "Run"]

[Metadata]
Name=ShadowInfo
Author=Ported for Albert (original: CAAY)
Information=System info skin ported from Conky ShadowInfo
Version=3.0
License=GPL v3

[Variables]
; ---- Edita esto para que coincida con tu adaptador de red ----
NetInterface=Wi-Fi
; ---- Edita esto para el disco que quieras monitorizar ----
Drive=C:
; ---- Borde derecho (en px) donde se alinea el bloque de fecha ----
DateRightEdge=200

FontName=Segoe UI
White=255,255,255
GrayLight=221,221,221
GrayMed=170,170,170
GrayDark=136,136,136
Orange=255,163,0
Green=119,183,83
Grey6=102,102,102
TimeColor=234,234,234

; =============================== MEASURES ====================================

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDayName]
Measure=Time
Format=%A

[MeasureDayNum]
Measure=Time
Format=%d

[MeasureMonthName]
Measure=Time
Format=%B

[MeasureYearNum]
Measure=Time
Format=%Y

[MeasureUptime]
Measure=Uptime

; --- Info de sistema (nativo de Rainmeter, sin PowerShell: instantaneo y gratis) ---
[MeasureLocalIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS

; --- Trigger: relanza MeasureGPUTemp cada 5s (RunCommand no se repite solo) ---
[MeasureGPUTempTrigger]
Measure=Calc
Formula=1
UpdateDivider=5
OnUpdateAction=[!CommandMeasure MeasureGPUTemp "Run"]

; --- Temperatura GPU (nvidia-smi, ya lo tienes instalado) ---
[MeasureGPUTemp]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "[Console]::Write((nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits).Trim())"
State=Hide
OutputType=UTF8
UpdateDivider=5
FinishAction=[!UpdateMeter MeterGPUTempValue][!Redraw]

; --- Trigger: relanza MeasureGPUUsage cada 1s. Este es el fix real del bug
;     de la grafica congelada: RunCommand NO se vuelve a ejecutar solo con
;     UpdateDivider, necesita que algo le mande "Run" activamente. ---
[MeasureGPUUsageTrigger]
Measure=Calc
Formula=1
UpdateDivider=1
OnUpdateAction=[!CommandMeasure MeasureGPUUsage "Run"]

; --- Uso de GPU en % (nvidia-smi), para la grafica tipo "CPU" ---
; RunCommand SI actualiza bien el texto (%1), pero su "valor numerico"
; interno no es el porcentaje: es un codigo de estado (-1/0/1/error), asi
; que un meter Line no puede usarlo para graficar directamente.
; El intento anterior (WebParser leyendo un archivo intermedio) fallaba
; por dos motivos a la vez: WebParser ignora el bang !UpdateMeasure (hace
; falta !CommandMeasure "Update"), y aunque se corrija eso, esa lectura es
; ASINCRONA -- el !UpdateMeter siguiente se ejecutaba antes de que
; WebParser hubiera terminado de leer el archivo, mostrando siempre el
; valor viejo (por eso se veia plana).
; La solucion simple y fiable: un measure Calc que coge el VALOR DE TEXTO
; de MeasureGPUUsage con Section Variables ([...] + DynamicVariables=1).
; Esto es sincrono -- no hace falta archivo ni WebParser.
[MeasureGPUUsage]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "[Console]::Write((nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits).Trim())"
State=Hide
OutputType=UTF8
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureGPUUsageGraph][!UpdateMeter MeterGPUValue][!UpdateMeter MeterGPUGraph][!Redraw]

[MeasureGPUUsageGraph]
Measure=Calc
Formula=[MeasureGPUUsage]
DynamicVariables=1
MinValue=0
MaxValue=100

[MeasureCPU]
Measure=CPU
Processor=0

; --- Memoria: el valor bruto son bytes usados; el % se calcula en el METER con Percentual=1 ---
[MeasureMemUsed]
Measure=Memory

; --- Trigger: relanza MeasureTopCPU cada 15s ---
[MeasureTopCPUTrigger]
Measure=Calc
Formula=1
UpdateDivider=15
OnUpdateAction=[!CommandMeasure MeasureTopCPU "Run"]

; --- Top 3 procesos por uso de CPU ---
[MeasureTopCPU]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "Get-Counter '\Process(*)\% Processor Time' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty CounterSamples | Where-Object {$_.InstanceName -notin 'idle','_total'} | Sort-Object CookedValue -Descending | Select-Object -First 3 | ForEach-Object {'{0,-20} {1,5:N1}%' -f $_.InstanceName,$_.CookedValue}"
State=Hide
OutputType=UTF8
UpdateDivider=15
FinishAction=[!UpdateMeter MeterTopCPUList][!Redraw]

; --- Trigger: relanza MeasureTopMem cada 10s ---
[MeasureTopMemTrigger]
Measure=Calc
Formula=1
UpdateDivider=10
OnUpdateAction=[!CommandMeasure MeasureTopMem "Run"]

; --- Top 3 procesos por uso de RAM ---
[MeasureTopMem]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -WindowStyle Hidden -Command "Get-Process | Sort-Object WorkingSet -Descending | Select-Object -First 3 | ForEach-Object {'{0,-20} {1,6:N0} MB' -f $_.ProcessName,($_.WorkingSet/1MB)}"
State=Hide
OutputType=UTF8
UpdateDivider=10
FinishAction=[!UpdateMeter MeterTopMemList][!Redraw]

; --- Disco: valores brutos en bytes; % y formato legible se aplican en los METERS ---
[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=#Drive#

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=#Drive#
Total=1

[MeasureDiskUsed]
Measure=FreeDiskSpace
Drive=#Drive#
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn
Interface=#NetInterface#

[MeasureNetOut]
Measure=NetOut
Interface=#NetInterface#

[MeasureNetInTotal]
Measure=NetIn
Interface=#NetInterface#
Cumulative=1

[MeasureNetOutTotal]
Measure=NetOut
Interface=#NetInterface#
Cumulative=1

; ================================ METERS ======================================

; --- Reloj (fijo arriba) + fecha apilada y alineada a la derecha ---
; El reloj ya no depende de nada -> Y fija, simple.
[MeterTime]
Meter=String
MeasureName=MeasureTime
X=430
Y=0
W=430
StringAlign=Right
FontFace=#FontName#
FontSize=90
FontColor=#TimeColor#
AntiAlias=1

; La fecha se construye de abajo hacia arriba: "2026" se ancla a la base
; del reloj, "30 July" va encima (combinados en un solo meter para poder
; alinear a la derecha sin depender de anchos propios), y "Thursday"
; encima de esa. Las 3 lineas usan una caja fija (X/W) que termina en
; #DateRightEdge#, con StringAlign=Right -- asi Rainmeter hace el ajuste
; el solo y no dependemos de que un meter "sepa" su propio ancho/alto
; (eso fue justo el bug de la version anterior: un meter referenciandose
; a si mismo con [MeterX:H] no funciona, se resuelve como 0).
[MeterYear]
Meter=String
MeasureName=MeasureYearNum
X=(#DateRightEdge#-80)
W=180
StringAlign=Right
Y=([MeterTime:Y]+[MeterTime:H]-60)
DynamicVariables=1
FontFace=#FontName#
FontSize=16
FontColor=#GrayLight#
AntiAlias=1

[MeterDayNumMonth]
Meter=String
MeasureName=MeasureDayNum
MeasureName2=MeasureMonthName
Text="%1 %2"
X=(#DateRightEdge#-80)
W=180
StringAlign=Right
Y=([MeterYear:Y]-27)
DynamicVariables=1
FontFace=#FontName#
FontSize=16
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterDayName]
Meter=String
MeasureName=MeasureDayName
X=(#DateRightEdge#-80)
W=180
StringAlign=Right
Y=([MeterDayNumMonth:Y]-27)
DynamicVariables=1
FontFace=#FontName#
FontSize=16
FontColor=#GrayLight#
AntiAlias=1

; --- SYSTEM ---
; Se referencia directamente la base del reloj (el elemento mas alto de
; los dos) en vez de depender del orden de meters anteriores.
[MeterSystemHeader]
Meter=String
Text=SYSTEM
X=20
Y=([MeterTime:Y]+[MeterTime:H])
DynamicVariables=1
FontFace=#FontName#
FontSize=20
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterSystemLine]
Meter=Shape
Shape=Rectangle 0,0,410,2 | Fill Color 255,163,0 | StrokeWidth 0
X=20
Y=3R

[MeterUptimeLabel]
Meter=String
Text="Uptime: "
X=20
Y=10R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1

[MeterUptimeValue]
Meter=String
MeasureName=MeasureUptime
X=5R
Y=0r
FontFace=#FontName#
FontSize=13
StringStyle=Bold
FontColor=#Orange#
AntiAlias=1

[MeterIPValue]
Meter=String
MeasureName=MeasureLocalIP
Text="IP local: %1"
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
StringStyle=Bold
FontColor=#Orange#
AntiAlias=1

; --- CPU ---
[MeterCPUHeader]
Meter=String
Text=CPU
X=20
Y=20R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
Text="%1%"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterCPUGraph]
Meter=Line
MeasureName=MeasureCPU
X=20
Y=10R
W=410
H=70
LineColor=119,183,83
LineWidth=2
AntiAlias=1

[MeterTopCPULabel]
Meter=String
Text="Top procesos (CPU):"
X=20
Y=10R
FontFace=#FontName#
FontSize=13
FontColor=#GrayMed#
AntiAlias=1

[MeterTopCPUList]
Meter=String
MeasureName=MeasureTopCPU
X=20
Y=5R
W=410
H=60
FontFace=Consolas
FontSize=12
FontColor=#GrayLight#
AntiAlias=1

; --- GPU ---
[MeterGPUHeader]
Meter=String
Text=GPU
X=20
Y=15R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

[MeterGPUValue]
Meter=String
MeasureName=MeasureGPUUsage
Text="%1%"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterGPUGraph]
Meter=Line
MeasureName=MeasureGPUUsageGraph
X=20
Y=10R
W=410
H=70
LineColor=255,163,0
LineWidth=2
AntiAlias=1

[MeterGPUTempLabel]
Meter=String
Text="Temperatura: "
X=20
Y=8R
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1

[MeterGPUTempValue]
Meter=String
MeasureName=MeasureGPUTemp
Text="%1 C"
DynamicVariables=1
X=5R
Y=0r
FontFace=#FontName#
FontSize=13
StringStyle=Bold
FontColor=#Orange#
AntiAlias=1

; --- MEMORY ---
[MeterMemHeader]
Meter=String
Text=MEMORY
X=20
Y=15R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

; Percentual=1 va en el METER (no en la medida): convierte el valor bruto
; (bytes usados) a % usando el rango 0-total que la medida Memory ya conoce.
[MeterMemValue]
Meter=String
MeasureName=MeasureMemUsed
Percentual=1
NumOfDecimals=0
Text="%1%"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterMemBar]
Meter=Bar
MeasureName=MeasureMemUsed
X=20
Y=12R
W=410
H=14
BarColor=119,183,83
SolidColor=40,40,40,180
BarOrientation=Horizontal

[MeterTopMemLabel]
Meter=String
Text="Top procesos (RAM):"
X=20
Y=10R
FontFace=#FontName#
FontSize=13
FontColor=#GrayMed#
AntiAlias=1

[MeterTopMemList]
Meter=String
MeasureName=MeasureTopMem
X=20
Y=5R
W=410
H=60
FontFace=Consolas
FontSize=12
FontColor=#GrayLight#
AntiAlias=1

; --- DISKS ---
[MeterDiskHeader]
Meter=String
Text=#Drive# DISK
X=20
Y=18R
FontFace=#FontName#
FontSize=18
FontColor=#Green#
StringStyle=Bold
AntiAlias=1

[MeterDiskUsedValue]
Meter=String
MeasureName=MeasureDiskUsed
Percentual=1
NumOfDecimals=0
Text="%1% usado"
DynamicVariables=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=18
FontColor=#Orange#
StringStyle=Bold
AntiAlias=1

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDiskUsed
X=20
Y=12R
W=410
H=14
BarColor=255,163,0
SolidColor=40,40,40,180
BarOrientation=Horizontal

[MeterDiskFreeLabel]
Meter=String
Text="Libre"
X=20
Y=8R
FontFace=#FontName#
FontSize=13
FontColor=#GrayMed#
AntiAlias=1

; AutoScale=1 va en el METER: formatea los bytes brutos como "157 GB" etc.
[MeterDiskFreeValue]
Meter=String
MeasureName=MeasureDiskFree
AutoScale=1
NumOfDecimals=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1

[MeterDiskTotalLabel]
Meter=String
Text="Total"
X=20
Y=3R
FontFace=#FontName#
FontSize=13
FontColor=#GrayMed#
AntiAlias=1

[MeterDiskTotalValue]
Meter=String
MeasureName=MeasureDiskTotal
AutoScale=1
NumOfDecimals=1
X=430
Y=0r
StringAlign=Right
FontFace=#FontName#
FontSize=13
FontColor=#GrayLight#
AntiAlias=1

; --- NETWORK ---
[MeterNetHeader]
